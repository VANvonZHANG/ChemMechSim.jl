description: minimal PLOG parser/rate test (2 species, 1 PLOG reaction)
generator: chemmechsim-phase6-test
phases:
  - name: gas
    thermo: ideal-gas
    elements: [H, O]
    species: [H2O, OH]
species:
  - name: H2O
    composition: {H: 2, O: 1}
    thermo:
      model: NASA7
      temperature-ranges: [200.0, 1000.0, 3500.0]
      data:
        - [-3.029e+04, 4.4e+01, -3.6e+00, 8.0e-03, -2.0e-06, 1.2e-09, -3.0e-13]
        - [1.0e+01, 2.0e-03, 1.0e-06, -1.0e-10, 1.0e-14, -3.5e+04, 8.0e-01]
    transport: {model: gas}
  - name: OH
    composition: {O: 1, H: 1}
    thermo:
      model: NASA7
      temperature-ranges: [200.0, 1000.0, 3500.0]
      data:
        - [-3.029e+04, 4.4e+01, -3.6e+00, 8.0e-03, -2.0e-06, 1.2e-09, -3.0e-13]
        - [1.0e+01, 2.0e-03, 1.0e-06, -1.0e-10, 1.0e-14, -3.5e+04, 8.0e-01]
    transport: {model: gas}
units: {length: cm, quantity: mol, activation-energy: cal/mol}
reactions:
  - equation: H2O <=> OH + OH   # plain equation (PLOG pressure-dependence is in rate-constants)
    type: pressure-dependent-Arrhenius
    rate-constants:
      - {P: 0.1 atm, A: 1.2e+15, b: -0.5, Ea: 0.0}
      - {P: 1.0 atm, A: 5.0e+14, b: -0.4, Ea: 0.0}
      - {P: 10.0 atm, A: 2.0e+14, b: -0.3, Ea: 0.0}
