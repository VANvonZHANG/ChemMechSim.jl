name: CompatHelper
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  CompatHelper:
    permissions:
      # Push the compathelper/* branch and open the version-bump PR. The repo's
      # Actions default is read-only, which 128-killed every push since
      # 2026-11-05 (same class as the TagBot tag-push 403).
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Pkg.add("CompatHelper")
        run: julia -e 'using Pkg; Pkg.add("CompatHelper")'
      - name: CompatHelper.main()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia -e 'using CompatHelper; CompatHelper.main()'
